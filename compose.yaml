name: client-portal-demo

services:
  postgres:
    image: postgres:17
    container_name: client-portal-postgres
    environment:
      POSTGRES_DB: client_portal
      POSTGRES_PASSWORD: client_portal
      POSTGRES_USER: client_portal
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - client-portal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U client_portal -d client_portal']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: client-portal-api
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://client_portal:client_portal@postgres:5432/client_portal
      LOG_LEVEL: info
      NODE_ENV: production
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3001/api/v1/health/ready").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: client-portal-web
    environment:
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_BASE_URL: http://api:3001/api/v1
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  client-portal-postgres-data:
