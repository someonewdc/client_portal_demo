packages:
  - apps/*
  - packages/*

engineStrict: true
enableGlobalVirtualStore: false
failIfNoMatch: true
injectWorkspacePackages: true
preferWorkspacePackages: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
verifyDepsBeforeRun: error

overrides:
  deepmerge-ts: 8.0.0
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'fast-uri@>=4.0.0 <4.1.3': 4.1.3
  'js-yaml@>=5.0.0 <=5.2.1': 5.2.2
  'mysql2@<3.22.0': 3.22.0

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
